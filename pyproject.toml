[project]
name = "world-events"
version = "0.1.0"
description = "世の中の出来事を、つながり（因果）と時間の流れで把握するシステム"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    "w3lib>=2.1",
    "openai>=1.40",
    "structlog>=24.1",
    "jinja2>=3.1",
    "protego>=0.3",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
# 重い・環境依存のもの。無くても動くように、使う側で遅延 import する
extract = ["trafilatura>=1.12", "selectolax>=0.3", "ultimate-sitemap-parser>=0.5"]
embed = ["sentence-transformers>=3.0"]     # bge-m3 を CPU で。ローカル・本番とも同じ実装
vector = ["sqlite-vec>=0.1.3"]
claude = ["anthropic>=0.40"]
mcp = [
    "mcp>=1.9",
]

[project.scripts]
news = "world_events.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_events"]
# migrations はパッケージの外（リポジトリ直下）に置くので、wheel には含めない（開発は editable 前提）

[tool.pytest.ini_options]
testpaths = ["tests"]
