<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>世界の出来事</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232f6fdf' stroke-width='3'/%3E%3Cpath d='M3 16h26M16 3c-5 6-5 20 0 26M16 3c5 6 5 20 0 26' fill='none' stroke='%232f6fdf' stroke-width='2'/%3E%3C/svg%3E">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/">世界の出来事</a>
    <nav id="nav">
      <a href="#/" data-nav="briefs">ブリーフ</a>
      <a href="#/events" data-nav="events">出来事</a>
      <a href="#/themes" data-nav="themes">テーマ</a>
      <a href="#/sources" data-nav="sources">情報源</a>
      <a href="#/requests" data-nav="requests">依頼<span id="pending-badge" class="badge" hidden></span></a>
    </nav>
  </div>
  <div id="statusline" class="statusline"></div>
</header>
<main id="view" aria-live="polite"></main>
<dialog id="req-dialog">
  <form method="dialog" id="req-form">
    <h2 id="req-title"></h2>
    <p class="muted small">依頼は Mac 側で取り込むとき（news requests pull、または Claude Code から）に検証・反映されます。通らないものは理由付きで却下されます。</p>
    <div id="req-fields"></div>
    <p id="req-error" class="error" hidden></p>
    <div class="actions">
      <button type="button" value="cancel" id="req-cancel" class="btn ghost">やめる</button>
      <button type="submit" class="btn primary">依頼する</button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
